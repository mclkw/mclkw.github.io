<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKW.fyi</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #05070a;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #e6edf3;
  }
  .bg-glow {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 70% 55% at 50% 52%, rgba(90,110,140,0.18), transparent 70%);
    pointer-events: none;
  }
  .scene {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ring {
    position: relative;
    width: 1px;
    height: 1px;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .card {
    position: absolute;
    top: 50%;
    left: 50%;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    transform: scale(1);
    transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .card.active img {
    transform: scale(1.2);
  }
  .card .shade {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.85) 50%, rgba(0,0,0,0.55) 78%, rgba(0,0,0,0) 100%);
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: multiply;
    filter: blur(1.4vmin);
    mask-repeat: no-repeat;
    mask-position: center;
    mask-size: contain;
    mask-mode: alpha;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: center;
    -webkit-mask-size: contain;
    -webkit-mask-source-type: alpha;
  }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="scene" id="scene">
  <div class="ring" id="ring"></div>
</div>

<script>
  const images = [
    "expired.png", "well.png", "football.png", "fallen.png",
    "HBD.png", "cans.png", "board.png", "cat.png", "bench.png"
  ];

  const scene = document.getElementById("scene");
  const ring = document.getElementById("ring");
  const cards = images.map((name) => {
    const card = document.createElement("div");
    card.className = "card";
    const img = document.createElement("img");
    img.src = "images/" + name;
    img.alt = name.replace(".png", "");
    const shade = document.createElement("div");
    shade.className = "shade";
    shade.style.maskImage = "url(images/" + name + ")";
    shade.style.webkitMaskImage = "url(images/" + name + ")";
    card.appendChild(img);
    card.appendChild(shade);
    ring.appendChild(card);
    return { card, shade };
  });

  const n = cards.length;
  const step = 360 / n;

  cards.forEach(({ card }, i) => {
    card.dataset.angle = i * step;
  });

  // theta: 0 = orbit runs left-right (wide windows), 90deg = orbit runs up-down (tall windows)
  function thetaForAspect(aspect) {
    const r = Math.log(aspect);
    const limit = Math.log(1.8);
    const t = Math.min(1, Math.max(0, (r + limit) / (2 * limit)));
    const eased = t * t * (3 - 2 * t);
    return (1 - eased) * 90;
  }

  let radius = 0;
  let thetaRad = 0;
  let cardW = 0;
  let cardH = 0;

  function layout() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const thetaDeg = thetaForAspect(vw / vh);
    const theta = thetaDeg * (Math.PI / 180);
    const cosT = Math.cos(theta), sinT = Math.sin(theta);

    // work in arbitrary base units, then solve for the largest scale
    // that keeps every orbit position (incl. hover growth) on-screen
    const cardW0 = 340, cardH0 = 460;
    const radius0 = (cardW0 / 2) / Math.tan(Math.PI / n);
    const dist0 = radius0 * 3.2;

    let maxX = 0, maxY = 0;
    const samples = 72;
    for (let i = 0; i < samples; i++) {
      const phi = (i / samples) * 2 * Math.PI;
      const x0 = radius0 * Math.sin(phi) * cosT;
      const y0 = radius0 * Math.sin(phi) * sinT;
      const z0 = radius0 * Math.cos(phi);
      const scale = dist0 / (dist0 - z0);
      const halfW = (cardW0 / 2) * scale * 1.2;
      const halfH = (cardH0 / 2) * scale * 1.2;
      maxX = Math.max(maxX, Math.abs(x0) * scale + halfW);
      maxY = Math.max(maxY, Math.abs(y0) * scale + halfH);
    }

    const availW = vw * 0.47;
    const availH = vh * 0.47;
    const scaleFactor = Math.min(availW / maxX, availH / maxY);

    cardW = cardW0 * scaleFactor;
    cardH = cardH0 * scaleFactor;
    radius = radius0 * scaleFactor;
    thetaRad = theta;
    scene.style.perspective = dist0 * scaleFactor + "px";

    cards.forEach(({ card }) => {
      card.style.width = cardW + "px";
      card.style.height = cardH + "px";
      card.style.marginLeft = -(cardW / 2) + "px";
      card.style.marginTop = -(cardH / 2) + "px";
    });
  }

  layout();
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  let angle = 0;
  const baseSpeed = 0.075;
  let speed = baseSpeed;
  let hovered = 0;

  cards.forEach(({ card }) => {
    const press = () => {
      if (card.classList.contains("active")) return;
      card.classList.add("active");
      hovered++;
    };
    const release = () => {
      if (!card.classList.contains("active")) return;
      card.classList.remove("active");
      hovered--;
    };
    // mouse: hover triggers it. touch/pen: only an actual press does.
    card.addEventListener("pointerenter", (e) => {
      if (e.pointerType === "mouse") press();
    });
    card.addEventListener("pointerleave", release);
    card.addEventListener("pointerdown", (e) => {
      if (e.pointerType !== "mouse") press();
    });
    card.addEventListener("pointerup", release);
    card.addEventListener("pointercancel", release);
  });

  function tick() {
    const target = hovered > 0 ? 0 : baseSpeed;
    speed += (target - speed) * 0.035;
    angle += speed;

    const cosT = Math.cos(thetaRad), sinT = Math.sin(thetaRad);
    const poleX = -sinT, poleY = cosT;

    cards.forEach(({ card, shade }) => {
      const phiDeg = parseFloat(card.dataset.angle) + angle;
      const phi = phiDeg * (Math.PI / 180);

      const x = radius * Math.sin(phi) * cosT;
      const y = radius * Math.sin(phi) * sinT;
      const z = radius * Math.cos(phi);

      card.style.transform =
        "translate3d(" + x + "px," + y + "px," + z + "px) rotate3d(" +
        poleX + "," + poleY + ",0," + phiDeg + "deg)";

      const depth = (1 - Math.cos(phi)) / 2;
      shade.style.opacity = Math.pow(depth, 0.7);
    });

    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
