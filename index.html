<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKW.fyi</title>
<meta name="description" content="Lea Kiri Wyrger is a cross-disciplinary artist and researcher based between Vienna and Berlin.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/styles/menu.css">
<link rel="stylesheet" href="/styles/site-header.css">
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  .logo {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
    pointer-events: none;
    will-change: transform;
  }
  .logo img {
    position: absolute;
    top: 0;
    left: 0;
    display: block;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  .logo img.visible {
    opacity: 1;
  }
  .collage {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
  }
  .cluster-frames {
    position: fixed;
    inset: 0;
    z-index: 40;
    pointer-events: none;
  }
  .cluster-frame {
    position: absolute;
    border: 1px solid #000000;
    box-sizing: border-box;
  }
  .piece {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 50;
    pointer-events: auto;
    cursor: pointer;
    will-change: transform;
    transition: opacity 0.3s ease;
  }
  .piece img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    transition: transform 0.35s cubic-bezier(.22,1,.36,1), filter 0.2s ease;
  }
  .piece:active img {
    transform: scale(0.96);
  }
  /* a thin border hugging the image's own alpha silhouette (not a
     rectangular box around it) - four zero-blur drop-shadows offset in
     each direction approximate an outline around the actual cut-out shape. */
  .piece.hovered img {
    filter:
      drop-shadow(1.5px 0 0 #000000)
      drop-shadow(-1.5px 0 0 #000000)
      drop-shadow(0 1.5px 0 #000000)
      drop-shadow(0 -1.5px 0 #000000);
  }
</style>
</head>
<body data-page="">
<div class="cluster-frames" id="clusterFrames"></div>
<div class="collage" id="collage"></div>
<div class="logo" id="logo">
  <img src="/images/logolila.png" alt="">
  <img src="/images/logoorange.png" alt="">
  <img src="/images/logoblau.png" alt="">
  <img src="/images/logorot.png" alt="">
</div>

<header class="site-header">
  <span class="brand">lea kiri wyrger</span>
  <nav class="menu">
    <a href="/work/" data-page="work">index</a>
    <a href="/about/" data-page="about">about</a>
    <a href="mailto:lea.wuertenberger@gmail.com" data-page="contact">e-mail</a>
    <a href="https://www.instagram.com/aka.lkw/" target="_blank" rel="noopener noreferrer" class="ig-link" aria-label="Instagram">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.6" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.3" cy="6.7" r="0.9" fill="currentColor"/></svg>
    </a>
  </nav>
</header>

<nav class="menu corner-menu" id="cornerMenu">
  <a href="#" data-filter="all" class="active">all</a>
  <a href="#" data-filter="art">visual art</a>
  <a href="#" data-filter="other">applied art</a>
  <a href="#" data-filter="research">research</a>
</nav>

<script src="/bounce.js"></script>
<script src="/menu.js"></script>
<script src="/collage.js"></script>
<script>
  (function () {
    var wrap = document.getElementById("logo");
    var imgs = Array.from(wrap.querySelectorAll("img"));
    var colorIndex = 0;
    imgs[0].classList.add("visible");

    function setColor(i) {
      imgs.forEach(function (img, idx) { img.classList.toggle("visible", idx === i); });
    }
    function bounceColor() {
      colorIndex = (colorIndex + 1) % imgs.length;
      setColor(colorIndex);
    }

    var headerEl = document.querySelector(".site-header");
    var lineY = 0;
    function updateLineY() {
      lineY = headerEl ? headerEl.getBoundingClientRect().height : 0;
    }

    var aspect = 0.5, logoW = 0, logoH = 0;
    function resizeLogo() {
      // scaling purely off width makes the logo feel too small once the
      // window gets tall and narrow (portrait/mobile) - give it a bigger
      // share of the (now much smaller) width there instead of staying
      // pinned to the same 1/5 ratio landscape uses.
      var portrait = window.innerHeight > window.innerWidth;
      logoW = window.innerWidth / (portrait ? 2.4 : 5);
      logoH = logoW * aspect;
      wrap.style.width = logoW + "px";
      wrap.style.height = logoH + "px";
      updateLineY();
    }
    function applyAspectFrom(img) {
      if (img.naturalWidth && img.naturalHeight) {
        aspect = img.naturalHeight / img.naturalWidth;
        resizeLogo();
      }
    }
    if (imgs[0].complete) applyAspectFrom(imgs[0]);
    else imgs[0].addEventListener("load", function () { applyAspectFrom(imgs[0]); }, { once: true });

    resizeLogo();
    window.addEventListener("resize", resizeLogo);
    window.addEventListener("orientationchange", resizeLogo);

    function size() { return { w: logoW, h: logoH }; }
    function bounds() {
      return {
        minX: 0, minY: lineY,
        maxX: Math.max(0, window.innerWidth - logoW),
        maxY: Math.max(0, window.innerHeight - logoH)
      };
    }
    function speed() {
      return Math.min(window.innerWidth, window.innerHeight) * 0.32;
    }

    var liveX = 40, liveY = 40, liveVx = 0, liveVy = 0;
    function applyFrame(x, y, vx, vy) {
      liveX = x; liveY = y; liveVx = vx; liveVy = vy;
      wrap.style.transform = "translate(" + x + "px," + y + "px)";
    }

    var stopFn = null;
    function startFreeRoam(x, y, vx, vy) {
      stopFn = window.startBounce({
        x: x, y: y, vx: vx, vy: vy,
        size: size, bounds: bounds, speed: speed,
        onBounce: bounceColor,
        onFrame: applyFrame,
        duration: null
      });
    }

    var startX = 40, startY = 40, startVx, startVy;
    var handoff = null;
    try {
      var raw = sessionStorage.getItem("lkw_logo_state");
      if (raw) {
        sessionStorage.removeItem("lkw_logo_state");
        handoff = JSON.parse(raw);
      }
    } catch (e) {}

    var b0 = bounds();
    if (handoff) {
      var sx = handoff.vw ? window.innerWidth / handoff.vw : 1;
      var sy = handoff.vh ? window.innerHeight / handoff.vh : 1;
      startX = Math.min(Math.max(b0.minX, handoff.x * sx), b0.maxX);
      startY = Math.min(Math.max(b0.minY, handoff.y * sy), b0.maxY);
      startVx = handoff.vx;
      startVy = handoff.vy;
    } else {
      startX = Math.min(Math.max(b0.minX, startX), b0.maxX);
      startY = Math.min(Math.max(b0.minY, startY), b0.maxY);
      var startAngle = (20 + Math.random() * 30) * (Math.PI / 180);
      startVx = Math.cos(startAngle) * (Math.random() < 0.5 ? -1 : 1);
      startVy = Math.sin(startAngle) * (Math.random() < 0.5 ? -1 : 1);
    }

    applyFrame(startX, startY, startVx, startVy);
    startFreeRoam(startX, startY, startVx, startVy);

    // plays the logo bouncing off toward the edge and hands its position/
    // velocity off via sessionStorage, so whichever page loads next can
    // pick its own logo up already moving instead of starting fresh. used
    // for every internal navigation away from this page, not just the
    // top-menu links - including collage piece clicks, wired up in
    // collage.js via window.lkwDepart.
    function departTo(href) {
      if (stopFn) stopFn();
      window.startBounce({
        x: liveX, y: liveY, vx: liveVx, vy: liveVy,
        size: size, bounds: bounds, speed: speed,
        onBounce: bounceColor,
        onFrame: applyFrame,
        duration: 550,
        onDone: function (final) {
          try {
            sessionStorage.setItem("lkw_logo_state", JSON.stringify({
              x: final.x, y: final.y, vx: final.vx, vy: final.vy,
              vw: window.innerWidth, vh: window.innerHeight
            }));
          } catch (err) {}
          window.location.href = href;
        }
      });
    }
    window.lkwDepart = departTo;

    document.querySelectorAll('.menu a[data-page="work"], .menu a[data-page="about"]').forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        departTo(a.getAttribute("href"));
      });
    });
  })();
</script>
</body>
</html>
