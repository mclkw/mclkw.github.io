<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LKW.fyi</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #00ff00;
  }
  .logo {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
    pointer-events: none;
    will-change: transform;
  }
  .logo img {
    position: absolute;
    top: 0;
    left: 0;
    display: block;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.45s ease;
  }
  .logo img.visible {
    opacity: 1;
  }
</style>
</head>
<body>
<div class="logo" id="logo">
  <img src="images/logolila.png" alt="">
  <img src="images/logoorange.png" alt="">
  <img src="images/logoblau.png" alt="">
  <img src="images/logorot.png" alt="">
</div>

<script>
  const wrap = document.getElementById("logo");
  const imgs = Array.from(wrap.querySelectorAll("img"));
  let colorIndex = 0;
  imgs[0].classList.add("visible");

  function setColor(i) {
    imgs.forEach((img, idx) => img.classList.toggle("visible", idx === i));
  }

  function bounceColor() {
    colorIndex = (colorIndex + 1) % imgs.length;
    setColor(colorIndex);
  }

  let aspect = 0.5;
  let logoW = 0, logoH = 0;

  function applyAspectFrom(img) {
    if (img.naturalWidth && img.naturalHeight) {
      aspect = img.naturalHeight / img.naturalWidth;
      layout();
    }
  }
  if (imgs[0].complete) applyAspectFrom(imgs[0]);
  else imgs[0].addEventListener("load", () => applyAspectFrom(imgs[0]), { once: true });

  let x = 40, y = 40;
  const startAngle = (20 + Math.random() * 30) * (Math.PI / 180);
  const signX = Math.random() < 0.5 ? -1 : 1;
  const signY = Math.random() < 0.5 ? -1 : 1;
  let vx = Math.cos(startAngle) * signX;
  let vy = Math.sin(startAngle) * signY;

  function layout() {
    logoW = window.innerWidth / 6;
    logoH = logoW * aspect;
    wrap.style.width = logoW + "px";
    wrap.style.height = logoH + "px";

    const maxX = Math.max(0, window.innerWidth - logoW);
    const maxY = Math.max(0, window.innerHeight - logoH);
    x = Math.min(Math.max(0, x), maxX);
    y = Math.min(Math.max(0, y), maxY);
  }

  layout();
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    const speed = Math.min(window.innerWidth, window.innerHeight) * 0.32;
    x += vx * speed * dt;
    y += vy * speed * dt;

    const maxX = Math.max(0, window.innerWidth - logoW);
    const maxY = Math.max(0, window.innerHeight - logoH);

    if (x <= 0) { x = 0; vx = Math.abs(vx); bounceColor(); }
    else if (x >= maxX) { x = maxX; vx = -Math.abs(vx); bounceColor(); }

    if (y <= 0) { y = 0; vy = Math.abs(vy); bounceColor(); }
    else if (y >= maxY) { y = maxY; vy = -Math.abs(vy); bounceColor(); }

    wrap.style.transform = "translate(" + x + "px," + y + "px)";
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
